# Builds the Vite site and publishes it to GitHub Pages at https://julianmilner.github.io/hackathon/
# on every push to main or deploy. Pages is enabled automatically on the first run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # Falls back to the committed .env.local when the secret is not set.
          VITE_GOOGLE_MAPS_TILES_KEY: ${{ secrets.VITE_GOOGLE_MAPS_TILES_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
